version: 1

project:
  name: shiptest
  repo: ..

repository_environment:
  commands_run_in: shiptest_environment
  source: local
  setup_commands:
    - npm ci
    - npm run check:fix
  validation_commands:
    required:
      - node --version
    advisory: []
  teardown_commands: []

snapshot:
  strategy: sanitized_copy
  git_lfs_handling: fail_on_pointers
  submodule_handling: fail_if_detected
  strip_real_git_metadata: true

runner:
  concurrency: 20
  model_attempts: 1

shiptest_runner:
  clean_git_repo:
    enabled: true
  prepared_baseline:
    enabled: true
    cache: true

tool_usage:
  record_tool_calls: true
  tool_output: none
  record_raw_events: false
  final_response: capped
  final_response_max_bytes: 8192
  stderr_max_bytes: 65536
  categories:
    - id: verification
      label: Verification
      highlights:
        - id: typecheck
          label: Typecheck
          match:
            tool: bash
            command_contains: npm run typecheck
        - id: tests
          label: Tests
          match:
            tool: bash
            command_contains: npm run test:run
        - id: build
          label: Build
          match:
            tool: bash
            command_contains: npm run build

models:
  - id: gpt-5.2
    provider: openai-codex
    model: gpt-5.2
  - id: gpt-5.4
    provider: openai-codex
    model: gpt-5.4
  - id: gpt-5.4-mini
    provider: openai-codex
    model: gpt-5.4-mini
  - id: gpt-5.5
    provider: openai-codex
    model: gpt-5.5

defaults:
  run:
    models:
      - gpt-5.2
      - gpt-5.4
      - gpt-5.4-mini
      - gpt-5.5
  limits:
    max_attempt_mins: 30
    max_turns: 40
    max_tool_calls: 200
    max_total_tokens: 5000000
    max_uncached_tokens: 1000000
    max_output_tokens: 250000
    max_cache_read_tokens: 5000000
  agent_context:
    load_context_files: false
    exclude_paths:
      - ".shiptest/**"
      - "dist/**"
    instruction_files: []
  evaluation:
    clean_room: true
    scoring_command: npm run typecheck && npm run test:run && npm run build
    hidden_evaluation_files: []
    hidden_evaluation_directories: []
    hidden_evaluation_patches: []
    dependency_changes: warn
    rerun_setup_on_dependency_change: false

benchmarks:
  - id: optional-project-repo-default
    type: implementation
    base_commit: f5c2ced
    task: tasks/optional-project-repo-default.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/config/config.test.ts

  - id: refactor-test-config-fixture-introduction
