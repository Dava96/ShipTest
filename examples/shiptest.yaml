version: 1
project:
  name: shiptest
  repo: ..
environment:
  setup:
    - npm ci
    - npm run check:fix
  validate:
    - node --version
runner:
  concurrency: 20
  model_attempts: 1
baselines:
  cache: true
artifacts:
  tool_calls: true
  tool_output: none
  raw_events: false
  final_response: capped
  final_response_max_bytes: 8192
  stderr_max_bytes: 65536
reporting:
  tool_categories:
    - id: verification
      label: Verification
      highlights:
        - id: typecheck
          label: Typecheck
          match:
            tool: bash
            command_contains: npm run typecheck
        - id: tests
          label: Tests
          match:
            tool: bash
            command_contains: npm run test:run
        - id: build
          label: Build
          match:
            tool: bash
            command_contains: npm run build
models:
  provider: openai-codex
  include:
    - gpt-5.2
    - gpt-5.4
    - gpt-5.4-mini
    - gpt-5.5
defaults:
  models:
    - gpt-5.2
    - gpt-5.4
    - gpt-5.4-mini
    - gpt-5.5
  limits:
    max_attempt_mins: 30
    max_turns: 40
    max_tool_calls: 200
    max_total_tokens: 5000000
    max_uncached_tokens: 1000000
    max_output_tokens: 250000
    max_cache_read_tokens: 5000000
  agent_view:
    load_context_files: false
    exclude_paths:
      - .shiptest/**
      - dist/**
  evaluation:
    command: npm run typecheck && npm run test:run && npm run build
    dependency_changes: warn
benchmarks:
  implementation:
    - id: optional-project-repo-default
      base_commit: fe58898
      task: tasks/optional-project-repo-default.md
      benchmark_runs: 1
      evaluation:
        command: npm run test:run -- src/config/config.test.ts
    - id: refactor-test-config-fixture-introduction
      base_commit: feb21f0
      task: tasks/refactor-test-config-fixture-introduction.md
      benchmark_runs: 1
      evaluation:
        command: npm run test:run -- src/config/config.test.ts
    - id: refactor-test-config-fixture-runner-adoption
      base_commit: 2a7e59a
      task: tasks/refactor-test-config-fixture-runner-adoption.md
      benchmark_runs: 1
      evaluation:
        command: npm run test:run -- src/run/plan.test.ts src/run/run.test.ts
    - id: refactor-test-config-fixture-suite-adoption
      base_commit: f1e0dc5
      task: tasks/refactor-test-config-fixture-suite-adoption.md
      benchmark_runs: 1
      evaluation:
        command: npm run test:run -- src/agent/pi-json-harness.test.ts
          src/config/config.test.ts src/doctor/run-doctor.test.ts
          src/evaluation/clean-room-evaluator.test.ts
          src/evaluation/hidden-payload.test.ts src/run/plan.test.ts
          src/run/run.test.ts src/snapshot/snapshot.test.ts
    - id: refactor-run-directory-layout
      base_commit: dd611d7
