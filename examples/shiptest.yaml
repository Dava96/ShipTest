version: 1

project:
  name: shiptest
  repo: ..

repository_environment:
  commands_run_in: shiptest_environment
  source: local
  setup_commands:
    - npm ci
    - npm run check:fix
  validation_commands:
    required:
      - node --version
    advisory: []
  teardown_commands: []

snapshot:
  strategy: sanitized_copy
  git_lfs_handling: fail_on_pointers
  submodule_handling: fail_if_detected
  strip_real_git_metadata: true

shiptest_runner:
  clean_git_repo:
    enabled: true
  prepared_baseline:
    enabled: true
    cache: true

models:
  - id: gpt-5.4-mini
    provider: openai-codex
    model: gpt-5.4-mini

defaults:
  run:
    models:
      - gpt-5.4-mini
  limits:
    max_attempt_mins: 30
    max_turns: 40
    max_tool_calls: 200
    max_total_tokens: 1000000
  agent_context:
    load_context_files: false
    exclude_paths:
      - ".shiptest/**"
      - "dist/**"
    instruction_files: []
  evaluation:
    clean_room: true
    scoring_command: npm run typecheck && npm run test:run && npm run build
    hidden_evaluation_files: []
    hidden_evaluation_directories: []
    hidden_evaluation_patches: []
    dependency_changes: warn
    rerun_setup_on_dependency_change: false

benchmarks:
  - id: optional-project-repo-default
    type: implementation
    base_commit: fe58898
    task: tasks/optional-project-repo-default.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/config/config.test.ts

  - id: refactor-test-config-fixture-introduction
    type: implementation
    base_commit: feb21f0
    task: tasks/refactor-test-config-fixture-introduction.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/config/config.test.ts

  - id: refactor-test-config-fixture-runner-adoption
    type: implementation
    base_commit: 2a7e59a
    task: tasks/refactor-test-config-fixture-runner-adoption.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/run/plan.test.ts src/run/run.test.ts

  - id: refactor-test-config-fixture-suite-adoption
    type: implementation
    base_commit: f1e0dc5
    task: tasks/refactor-test-config-fixture-suite-adoption.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/agent/pi-json-harness.test.ts src/config/config.test.ts src/doctor/run-doctor.test.ts src/evaluation/clean-room-evaluator.test.ts src/evaluation/hidden-payload.test.ts src/run/plan.test.ts src/run/run.test.ts src/snapshot/snapshot.test.ts

  - id: refactor-run-directory-layout
    type: implementation
    base_commit: dd611d7
    task: tasks/refactor-run-directory-layout.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/run/run-layout.test.ts src/run/run.test.ts

  - id: refactor-resettable-workspace-pool
    type: implementation
    base_commit: e0aabd9
    task: tasks/refactor-resettable-workspace-pool.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/workspace/resettable-workspace.test.ts src/agent/pi-json-harness.test.ts src/evaluation/clean-room-evaluator.test.ts src/run/run.test.ts

  - id: refactor-pi-model-availability-precheck
    type: implementation
    base_commit: 6c79bf0
    task: tasks/refactor-pi-model-availability-precheck.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/run/model-availability.test.ts src/run/run.test.ts src/agent/pi-json-harness.test.ts

  - id: report-total-estimated-cost
    type: implementation
    base_commit: 6f63300
    task: tasks/report-total-estimated-cost.md
    attempts: 1
    evaluation:
      scoring_command: npm run test:run -- src/reporting/html-report.test.ts

  - id: shiptest-smoke
    type: implementation
    task: tasks/shiptest-smoke.md
    attempts: 1
